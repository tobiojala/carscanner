services:
  db:
    image: postgres:16-alpine
    container_name: car-arbitrage-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_arbitrage}
      POSTGRES_USER: ${POSTGRES_USER:-car_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: car-arbitrage-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-car_user}:${POSTGRES_PASSWORD:-car_password}@db:5432/${POSTGRES_DB:-car_arbitrage}
      BACKEND_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: car-arbitrage-frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/app:/app/frontend/app
      - ./frontend/components:/app/frontend/components
      - ./frontend/lib:/app/frontend/lib
      - ./frontend/public:/app/frontend/public
    depends_on:
      - backend

volumes:
  postgres_data:
